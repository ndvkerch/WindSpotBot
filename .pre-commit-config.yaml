repos:
  - repo: local
    hooks:
      - id: update-docs
        name: Обновление документации
        entry: python scripts/update_docs.py
        language: system
        files: ^(src/|tests/|migrations/).*\.py$
        pass_filenames: false
        always_run: true
        
      - id: update-changelog
        name: Обновление CHANGELOG
        entry: python scripts/update_changelog.py
        language: system
        files: ^(src/|tests/|migrations/).*\.py$
        pass_filenames: false
        always_run: true
        
      - id: format-code
        name: Форматирование кода
        entry: black
        language: system
        files: ^src/.*\.py$
        args: [--line-length=88, --target-version=py311]
        
      - id: lint-code
        name: Проверка стиля кода
        entry: flake8
        language: system
        files: ^src/.*\.py$
        args: [--max-line-length=88, --extend-ignore=E203,W503]
        
      - id: type-check
        name: Проверка типов
        entry: mypy
        language: system
        files: ^src/.*\.py$
        args: [--ignore-missing-imports, --no-strict-optional]
        
      - id: test-check
        name: Быстрая проверка тестов
        entry: python -m pytest
        language: system
        files: ^(src/|tests/).*\.py$
        args: [--maxfail=1, -x]
        pass_filenames: false



